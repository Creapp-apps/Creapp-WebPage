appId: com.creapp.desktop
productName: "CreAPP Suite"
directories:
  output: dist
files:
  - main.mjs
  - preload.mjs
  - package.json
  - src/**/*
  - renderer/**/*
  - "!**/*.test.mjs"
# node-pty es nativo (.node): no puede ejecutarse desde dentro del asar → se desempaqueta.
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  target: dir
  identity: null
  icon: build/icon.png
