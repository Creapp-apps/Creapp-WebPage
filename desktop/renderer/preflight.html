<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'">
<title>CreAPP — Preparando tu estación</title>
<style>
  :root { --v: #8b5cf6; --m: #d946ef; --ok: #34d399; --bad: #f87171; --mut: #8b93a7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; color: #e8eaf0; font: 15px -apple-system, system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 20%, #1a1230 0%, #0b0d12 60%); }
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .15;
    animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity: .1; } 50% { opacity: .5; } }

  .stage { position: relative; height: 100%; display: flex; align-items: center; justify-content: center; gap: 56px; padding: 32px; }
  .left { display: flex; flex-direction: column; align-items: center; width: 220px; }
  .right { width: 460px; max-width: 52vw; max-height: calc(100vh - 64px); overflow-y: auto; padding-right: 4px; }

  #rocketWrap { width: 180px; animation: float 3.4s ease-in-out infinite; transform-origin: 50% 60%; }
  #rocketWrap.launch { animation: liftoff 1.5s cubic-bezier(.5,0,.9,.4) forwards; }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(-.8deg); } 50% { transform: translateY(-8px) rotate(.8deg); } }
  @keyframes liftoff { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120vh) scale(.8); opacity: 0; } }

  .part { opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; transform: scale(.3); }
  .part.on { animation: pop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes pop { 0% { opacity: 0; transform: scale(.3) translateY(14px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
  #flame { opacity: 0; transform-box: fill-box; transform-origin: 50% 0%; }
  #flame.on { opacity: 1; animation: flicker .35s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scaleY(.8); } to { transform: scaleY(1.25); } }
  #rocketWrap.launch #flame { animation: flicker .12s ease-in-out infinite alternate; transform: scaleY(2); }
  #flame2 { opacity: 0; }
  #flame.on ~ #flame2 { opacity: .9; }
  .spark { fill: #fbbf24; opacity: 0; }
  #rocketWrap.live .spark { animation: spark 1.4s ease-out infinite; }
  .spark:nth-child(2) { animation-delay: .4s !important; } .spark:nth-child(3) { animation-delay: .8s !important; }
  @keyframes spark { 0% { opacity: .9; transform: translateY(0); } 100% { opacity: 0; transform: translateY(26px); } }

  h1 { font-size: 22px; margin: 0 0 4px; }
  #status { color: var(--mut); margin: 0 0 20px; min-height: 20px; }
  ul { list-style: none; padding: 0; margin: 0 0 18px; }
  li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 8px; border-radius: 12px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
    opacity: 0; transform: translateX(24px); }
  li.in { animation: slidein .5s cubic-bezier(.16,1,.3,1) forwards; }
  @keyframes slidein { to { opacity: 1; transform: translateX(0); } }
  .badge { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: #0b0d12; background: #2a3150; }
  li.pending .badge { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(139,92,246,.5); } 50% { box-shadow: 0 0 0 7px rgba(139,92,246,0); } }
  li.ok .badge { background: var(--ok); animation: badgepop .5s cubic-bezier(.34,1.56,.64,1); box-shadow: 0 0 14px rgba(52,211,153,.45); }
  li.fail .badge { background: var(--bad); animation: badgepop .5s cubic-bezier(.34,1.56,.64,1); }
  @keyframes badgepop { from { transform: scale(0); } to { transform: scale(1); } }
  .txt { min-width: 0; }
  .label { font-weight: 600; }
  .detail { color: var(--mut); font-size: 12px; margin-top: 1px; word-break: break-word; opacity: .8; }
  .fix { color: #fbbf24; font-size: 12px; margin-top: 3px; }

  #retry { background: linear-gradient(90deg, var(--v), var(--m)); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 22px; font-size: 14px; cursor: pointer; }
  #retry:disabled { opacity: .5; cursor: default; }
  body.err #status { color: #fbbf24; }
  @media (prefers-reduced-motion: reduce) { #rocketWrap, .stars i { animation: none; } }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="stage">
    <div class="left">
      <div id="rocketWrap">
        <svg viewBox="0 0 120 220" width="180" role="img" aria-label="Cohete CreAPP">
          <defs>
            <linearGradient id="gBody" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e5e7f0"/><stop offset="1" stop-color="#9ca3c4"/></linearGradient>
            <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#d946ef"/></linearGradient>
          </defs>
          <g id="flameG"><path id="flame" d="M48 176 Q60 232 72 176 Z" fill="#fb923c"/><path id="flame2" d="M54 176 Q60 206 66 176 Z" fill="#fde047"/></g>
          <g class="part" data-part="engines"><rect x="46" y="168" width="28" height="12" rx="3" fill="#374151"/><rect x="42" y="176" width="36" height="6" rx="2" fill="#1f2937"/></g>
          <g class="part" data-part="fins"><path d="M38 120 L16 170 L40 160 Z" fill="url(#gAcc)"/><path d="M82 120 L104 170 L80 160 Z" fill="url(#gAcc)"/><path d="M56 150 L60 176 L64 150 Z" fill="#6d28d9"/></g>
          <g class="part" data-part="body"><path d="M40 60 L80 60 L82 168 L38 168 Z" fill="url(#gBody)"/><rect x="38" y="128" width="44" height="8" fill="url(#gAcc)"/></g>
          <g class="part" data-part="nose"><path d="M40 62 Q60 -8 80 62 Z" fill="url(#gAcc)"/></g>
          <g class="part" data-part="window"><circle cx="60" cy="94" r="14" fill="#1f2937"/><circle cx="60" cy="94" r="14" fill="none" stroke="#a78bfa" stroke-width="3" stroke-opacity=".35"/><circle cx="60" cy="94" r="11" fill="#38bdf8"/><circle cx="56" cy="90" r="3.5" fill="#fff" opacity=".7"/></g>
          <g id="sparks"><circle class="spark" cx="50" cy="186" r="2"/><circle class="spark" cx="60" cy="190" r="2.5"/><circle class="spark" cx="70" cy="186" r="2"/></g>
        </svg>
      </div>
    </div>
    <div class="right">
      <h1 id="title">Armando tu estación</h1>
      <p id="status">Ensamblando tu estación…</p>
      <ul id="checks"></ul>
      <button id="retry" hidden>Reintentar</button>
    </div>
  </div>
  <script src="preflight.js"></script>
</body>
</html>
