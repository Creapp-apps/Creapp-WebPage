<!DOCTYPE html>
<html lang="es" class="dark splash-active">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CreAPP – Software Lab</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#070709" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CreAPP OS" />
  <meta name="application-name" content="CreAPP OS" />

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- Open Graph / WhatsApp Preview Tags -->
  <meta property="og:title" content="CreAPP – Software Lab" />
  <meta property="og:description"
    content="Diseñamos y desarrollamos software a medida para startups y empresas que quieren crecer." />
  <meta property="og:image" content="https://creapp.com.ar/logocreapp_new.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">

  <script>
    try {
      var isStandalone = window.matchMedia('(display-mode: standalone)').matches || (window.navigator && window.navigator.standalone === true);
      if (sessionStorage.getItem('creapp_pwa_splash_seen') && !isStandalone) {
        document.documentElement.classList.add('skip-splash');
      }
    } catch(e) {}
  </script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background-color: #070709;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    html.splash-active,
    html.splash-active body {
      overflow: hidden !important;
      height: 100% !important;
      height: 100dvh !important;
      min-height: -webkit-fill-available !important;
    }
    html.skip-splash #pwa-static-splash {
      display: none !important;
    }
    #root {
      width: 100%;
      min-height: 100%;
    }
  </style>
</head>

<body>
  <!-- Static HTML/CSS Zero-Latency Splash Screen (Pixel-perfect clone of PwaSplashScreen) -->
  <div id="pwa-static-splash" style="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;height:100dvh;min-height:-webkit-fill-available;background:#070709;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none;transition:opacity 0.4s ease-out;pointer-events:none;overflow:hidden;">
    
    <!-- Ambient Cosmic Nebula Glow -->
    <div style="position:absolute;top:12%;left:50%;transform:translateX(-50%);width:380px;height:380px;background:radial-gradient(circle,rgba(255,45,120,0.25) 0%,rgba(155,48,255,0.2) 50%,transparent 70%);border-radius:50%;filter:blur(90px);pointer-events:none;"></div>

    <!-- Starfield (Exact coordinates matching React PwaSplashScreen) -->
    <div style="position:absolute;inset:0;pointer-events:none;overflow:hidden;">
      <div style="position:absolute;top:6%;left:16%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite;"></div>
      <div style="position:absolute;top:10%;left:82%;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.4s;"></div>
      <div style="position:absolute;top:14%;left:38%;width:4.5px;height:4.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.8s;"></div>
      <div style="position:absolute;top:18%;left:68%;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.2s;"></div>
      <div style="position:absolute;top:24%;left:12%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.6s;"></div>
      <div style="position:absolute;top:28%;left:88%;width:3.5px;height:3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 1s;"></div>
      <div style="position:absolute;top:35%;left:25%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.3s;"></div>
      <div style="position:absolute;top:42%;left:78%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.7s;"></div>
      <div style="position:absolute;top:48%;left:15%;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.5s;"></div>
      <div style="position:absolute;top:54%;left:84%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.9s;"></div>
      <div style="position:absolute;top:65%;left:30%;width:3.5px;height:3.5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.6s;"></div>
      <div style="position:absolute;top:72%;left:72%;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:creapp-twinkle 2s ease-in-out infinite 0.2s;"></div>
    </div>

    <!-- Center Logo & Branding Block (Exact pixel alignment) -->
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;">
      <!-- Neon Glow Behind Rocket -->
      <div style="position:absolute;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(255,45,120,0.55),rgba(155,48,255,0.55),transparent);filter:blur(24px);pointer-events:none;"></div>
      
      <img src="/CREAPP%20LOGO%20VECTOR.png" alt="CreAPP Rocket" width="72" height="126" style="width:72px;height:126px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,45,120,0.7));animation:creapp-wobble 1.6s ease-in-out infinite;" />
      
      <!-- Static Thruster Flame -->
      <div style="width:18px;height:26px;background:linear-gradient(180deg,#FF2D78,#9B30FF,transparent);clip-path:polygon(15% 0%,85% 0%,100% 70%,50% 100%,0% 70%);filter:blur(0.6px);box-shadow:0 6px 18px #FF2D78;animation:creapp-flame 0.22s ease-in-out infinite alternate;margin-top:-8px;"></div>
      
      <!-- Typography creapp -->
      <div style="margin-top:20px;font-size:32px;font-weight:900;letter-spacing:-1px;color:#ffffff;text-align:center;line-height:1.2;">
        cre<span style="background:linear-gradient(90deg,#FF2D78,#9B30FF,#00F0FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">app</span>
      </div>
      
      <!-- Subtitle Software Lab -->
      <p style="margin-top:6px;font-size:11px;font-family:monospace;letter-spacing:3px;color:#9ca3af;text-transform:uppercase;">Software Lab</p>
      
      <!-- Smooth Progress Bar matching React component -->
      <div style="margin-top:24px;width:130px;height:3px;background:rgba(255,255,255,0.1);border-radius:999px;position:relative;overflow:hidden;box-shadow:0 0 10px rgba(255,45,120,0.3);">
        <div style="height:100%;background:linear-gradient(90deg,#FF2D78,#9B30FF,#00F0FF);border-radius:999px;box-shadow:0 0 12px #FF2D78;animation:creapp-progress-fill 1.8s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;"></div>
      </div>
    </div>

    <style>
      @keyframes creapp-progress-fill{0%{width:0%}15%{width:22%}45%{width:58%}75%{width:85%}100%{width:100%}}
      @keyframes creapp-wobble{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
      @keyframes creapp-flame{0%{transform:scaleY(1) scaleX(1.05)}100%{transform:scaleY(1.3) scaleX(0.92)}}
      @keyframes creapp-twinkle{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
    </style>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
