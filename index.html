<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CreAPP – Software Lab</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#070709" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CreAPP OS" />
  <meta name="application-name" content="CreAPP OS" />

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- Open Graph / WhatsApp Preview Tags -->
  <meta property="og:title" content="CreAPP – Software Lab" />
  <meta property="og:description"
    content="Diseñamos y desarrollamos software a medida para startups y empresas que quieren crecer." />
  <meta property="og:image" content="https://creapp.com.ar/logocreapp_new.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <!-- Static HTML/CSS Zero-Latency Splash Screen (Sibling of #root, prevents React mount flash) -->
  <div id="pwa-static-splash" style="position:fixed;inset:0;background:#070709;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none;transition:opacity 0.25s ease-out;pointer-events:none;">
    <!-- Ambient Cosmic Glow -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(255,45,120,0.25) 0%,rgba(155,48,255,0.2) 50%,transparent 70%);border-radius:50%;filter:blur(60px);pointer-events:none;"></div>

    <!-- Center Logo & Branding -->
    <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;">
      <img src="/CREAPP%20LOGO%20VECTOR.png" alt="CreAPP Rocket" style="width:72px;height:auto;object-fit:contain;filter:drop-shadow(0 0 20px rgba(255,45,120,0.7));animation:creapp-pulse 1.8s ease-in-out infinite;" />
      <!-- Static Thruster Flame -->
      <div style="width:18px;height:26px;background:linear-gradient(180deg,#FF2D78,#9B30FF,transparent);clip-path:polygon(15% 0%,85% 0%,100% 70%,50% 100%,0% 70%);filter:blur(1px);animation:creapp-flame 0.3s ease-in-out infinite alternate;margin-top:-8px;"></div>
      <div style="margin-top:20px;font-size:32px;font-weight:900;letter-spacing:-1px;color:#ffffff;text-align:center;">
        cre<span style="background:linear-gradient(90deg,#FF2D78,#9B30FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">app</span>
      </div>
      <p style="margin-top:6px;font-size:11px;font-family:monospace;letter-spacing:3px;color:#9ca3af;text-transform:uppercase;">Software Lab</p>
      
      <!-- Laser Progress Bar -->
      <div style="margin-top:24px;width:120px;height:2.5px;background:rgba(255,255,255,0.08);border-radius:999px;position:relative;overflow:hidden;">
        <div style="position:absolute;inset:0;width:50%;background:linear-gradient(90deg,transparent,#FF2D78,#9B30FF);border-radius:999px;animation:creapp-laser 1.1s ease-in-out infinite;box-shadow:0 0 10px #FF2D78;"></div>
      </div>
    </div>

    <style>
      @keyframes creapp-laser{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
      @keyframes creapp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes creapp-flame{0%{transform:scaleY(0.9) scaleX(1.05)}100%{transform:scaleY(1.3) scaleX(0.92)}}
    </style>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
