<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CreAPP – Software Lab</title>

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#070709" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CreAPP OS" />
  <meta name="application-name" content="CreAPP OS" />

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- Open Graph / WhatsApp Preview Tags -->
  <meta property="og:title" content="CreAPP – Software Lab" />
  <meta property="og:description"
    content="Diseñamos y desarrollamos software a medida para startups y empresas que quieren crecer." />
  <meta property="og:image" content="https://creapp.com.ar/logocreapp_new.png" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root">
    <div id="pwa-static-splash" style="position:fixed;inset:0;background:#070709;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:32px 24px;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;-webkit-user-select:none;">
      <!-- Ambient Cosmic Glow -->
      <div style="position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:280px;height:280px;background:radial-gradient(circle,rgba(255,45,120,0.25) 0%,rgba(155,48,255,0.2) 50%,transparent 70%);border-radius:50%;filter:blur(60px);pointer-events:none;"></div>
      
      <!-- Top Pill -->
      <div style="position:relative;z-index:2;margin-top:20px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);display:inline-flex;align-items:center;gap:8px;">
        <span style="width:6px;height:6px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981;"></span>
        <span style="font-size:10px;font-family:monospace;letter-spacing:2px;color:#d1d5db;text-transform:uppercase;font-weight:600;">CreAPP OS</span>
      </div>

      <!-- Center Logo & Branding -->
      <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;">
        <div style="width:96px;height:96px;border-radius:24px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);padding:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 40px rgba(0,0,0,0.5),0 0 30px rgba(255,45,120,0.2);animation:creapp-pulse 2s ease-in-out infinite;">
          <img src="/CREAPP%20LOGO%20VECTOR.png" alt="CreAPP" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 16px rgba(255,45,120,0.6));" />
        </div>
        <div style="margin-top:20px;font-size:30px;font-weight:900;letter-spacing:-1px;color:#ffffff;">
          cre<span style="background:linear-gradient(90deg,#FF2D78,#9B30FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">app</span>
          <span style="font-size:11px;font-family:monospace;font-weight:600;padding:2px 6px;border-radius:4px;background:rgba(168,85,247,0.2);color:#d8b4fe;border:1px solid rgba(168,85,247,0.3);vertical-align:middle;margin-left:6px;">OS</span>
        </div>
        <p style="margin-top:6px;font-size:11px;font-family:monospace;letter-spacing:2px;color:#9ca3af;text-transform:uppercase;">Software Lab</p>
        
        <!-- Laser Progress Bar -->
        <div style="margin-top:28px;width:120px;height:3px;background:rgba(255,255,255,0.08);border-radius:999px;position:relative;overflow:hidden;">
          <div style="position:absolute;inset:0;width:50%;background:linear-gradient(90deg,transparent,#FF2D78,#9B30FF);border-radius:999px;animation:creapp-laser 1.2s ease-in-out infinite;box-shadow:0 0 10px #FF2D78;"></div>
        </div>
      </div>

      <!-- Bottom Tag -->
      <div style="position:relative;z-index:2;margin-bottom:12px;font-size:10px;font-family:monospace;letter-spacing:2px;color:#4b5563;text-transform:uppercase;">
        Innovation Hub • Ready
      </div>

      <style>
        @keyframes creapp-laser{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
        @keyframes creapp-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      </style>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
