<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- PWA & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#070709" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CreAPP OS" />
  <meta name="application-name" content="CreAPP OS" />

  <!-- PWA Manifest & App Icons -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="icon" type="image/png" href="/icon-192.png" />

  <!-- Open Graph / WhatsApp Preview Tags -->
  <meta property="og:title" content="CreAPP – Software Lab" />

    content="Diseñamos y desarrollamos software a medida para startups y empresas que quieren crecer." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#070709;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
      <div style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.08);border-top-color:#FF2D78;border-right-color:#9B30FF;border-radius:50%;animation:creapp-spin 0.75s cubic-bezier(0.5,0,0.5,1) infinite;"></div>
      <style>@keyframes creapp-spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>

</html>
